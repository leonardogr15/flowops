[project]
name = "flowops-api"
version = "0.1.0"
description = "FlowOps API — multi-tenant approval workflows"
readme = "../README.md"
license = "MIT"
requires-python = ">=3.14,<3.15"
dependencies = [
    "django>=6.1.3,<6.2",
    "djangorestframework>=3.18.3,<3.19",
    "drf-spectacular>=0.30.0,<0.31",
    "psycopg[binary]>=3.3.9,<3.4",
    "argon2-cffi>=25.1.0",
    "redis>=8.2.0,<9",
    "gunicorn>=27.0.1,<28",
    "structlog>=26.1.0,<27",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-django>=4.14.0",
    "pytest-cov>=7",
    "ruff>=0.14",
    "mypy>=1.19",
    "django-stubs[compatible-mypy]>=6.1.2",
    "djangorestframework-stubs>=3.18.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DJ", "SIM", "RUF", "PT"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]
"**/migrations/**" = ["E501", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["migrations/", "tests/"]

[[tool.mypy.overrides]]
module = ["drf_spectacular.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "-q --strict-markers --cov=apps --cov=common --cov-report=term-missing:skip-covered --cov-fail-under=85"

[tool.coverage.run]
omit = ["*/migrations/*", "*/tests/*", "*/management/commands/*"]
