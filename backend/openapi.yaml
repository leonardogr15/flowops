  /api/v1/org/audit-events:
    get:
      operationId: audit_events_list
      description: Mixin for API views that operate inside one organization.
      parameters:
      - in: header
        name: X-Organization
        schema:
          type: string
        description: Slug of the active organization.
        required: true
      - in: query
        name: actor
        schema:
          type: string
        description: Actor email
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: from
        schema:
          type: string
        description: ISO 8601, inclusive
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: target
        schema:
          type: string
        description: Target id (UUID)
      - in: query
        name: to
        schema:
          type: string
        description: ISO 8601, exclusive
      - in: query
        name: verb
        schema:
          type: string
        description: Prefix, e.g. `request.` or `member.role_changed`
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditEventList'
          description: ''
