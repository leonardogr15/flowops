openapi: 3.0.3
info:
  title: FlowOps API
  version: 0.1.0
  description: Multi-tenant approval workflows. Session authentication with CSRF.
paths:
  /api/v1/auth/csrf:
    get:
      operationId: auth_csrf
      description: Sets the CSRF cookie so the SPA can send X-CSRFToken on unsafe
        requests.
      tags:
      - v1
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfResponse'
          description: ''
  /api/v1/auth/login:
    post:
      operationId: auth_login
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/logout:
    post:
      operationId: auth_logout
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/me:
    get:
      operationId: auth_me
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/invitations/{token}:
    get:
      operationId: invitations_preview
      description: What an invitation link is for. The token itself is the credential.
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreview'
          description: ''
  /api/v1/invitations/{token}/accept:
    post:
      operationId: invitations_accept
      description: Signed-in users accept with an empty body. New users send full_name
        and password; the account is created and signed in.
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
      security:
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedInvitation'
          description: ''
  /api/v1/org:
    get:
      operationId: v1_org_retrieve
      description: The active organization. Members read; admins and owners rename.
      parameters:
      - in: header
        name: X-Organization
        schema:
          type: string
        description: Slug of the active organization.
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentOrganization'
          description: ''
    patch:
