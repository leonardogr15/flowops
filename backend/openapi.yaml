openapi: 3.0.3
info:
  title: FlowOps API
  version: 0.1.0
  description: Multi-tenant approval workflows. Session authentication with CSRF.
paths:
  /api/v1/auth/csrf:
    get:
      operationId: auth_csrf
      description: Sets the CSRF cookie so the SPA can send X-CSRFToken on unsafe
        requests.
      tags:
      - v1
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfResponse'
          description: ''
  /api/v1/auth/login:
    post:
      operationId: auth_login
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/logout:
    post:
      operationId: auth_logout
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/me:
    get:
      operationId: auth_me
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/invitations/{token}:
    get:
      operationId: invitations_preview
      description: What an invitation link is for. The token itself is the credential.
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreview'
          description: ''
  /api/v1/invitations/{token}/accept:
    post:
      operationId: invitations_accept
      description: Signed-in users accept with an empty body. New users send full_name
        and password; the account is created and signed in.
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
      security:
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedInvitation'
          description: ''
  /api/v1/org:
    get:
      operationId: v1_org_retrieve
      description: The active organization. Members read; admins and owners rename.
      parameters:
      - in: header
        name: X-Organization
        schema:
          type: string
        description: Slug of the active organization.
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentOrganization'
          description: ''
    patch:
      operationId: v1_org_partial_update
      description: The active organization. Members read; admins and owners rename.
      parameters:
      - in: header
        name: X-Organization
        schema:
          type: string
        description: Slug of the active organization.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCurrentOrganizationRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentOrganization'
          description: ''
  /api/v1/org/invitations:
    get:
      operationId: v1_org_invitations_list
      description: Pending invitations of the active organization (admins and owners).
      parameters:
      - in: header
        name: X-Organization
        schema:
          type: string
        description: Slug of the active organization.
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invitation'
          description: ''
    post:
      operationId: v1_org_invitations_create
      description: Pending invitations of the active organization (admins and owners).
      parameters:
      - in: header
        name: X-Organization
        schema:
          type: string
        description: Slug of the active organization.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedInvitation'
          description: ''
  /api/v1/org/invitations/{id}:
    delete:
      operationId: org_invitations_revoke
      description: Mixin for API views that operate inside one organization.
      parameters:
      - in: header
        name: X-Organization
        schema:
          type: string
        description: Slug of the active organization.
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/org/members:
    get:
      operationId: v1_org_members_list
      description: Mixin for API views that operate inside one organization.
      parameters:
      - in: header
        name: X-Organization
        schema:
          type: string
        description: Slug of the active organization.
        required: true
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMemberList'
          description: ''
  /api/v1/org/members/{id}:
    patch:
      operationId: org_members_change_role
      description: Change a member's role or remove them. Members may remove themselves
        (leave).
      parameters:
      - in: header
        name: X-Organization
        schema:
          type: string
        description: Slug of the active organization.
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedChangeRoleRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
          description: ''
    delete:
      operationId: org_members_remove
      description: Change a member's role or remove them. Members may remove themselves
        (leave).
      parameters:
      - in: header
        name: X-Organization
        schema:
          type: string
        description: Slug of the active organization.
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/org/workflow-templates:
    get:
      operationId: workflow_templates_list
      description: Mixin for API views that operate inside one organization.
      parameters:
      - in: header
        name: X-Organization
        schema:
          type: string
        description: Slug of the active organization.
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TemplateList'
          description: ''
    post:
      operationId: workflow_templates_create
      description: Mixin for API views that operate inside one organization.
      parameters:
      - in: header
        name: X-Organization
        schema:
          type: string
        description: Slug of the active organization.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateDetail'
          description: ''
  /api/v1/org/workflow-templates/{id}:
    get:
      operationId: workflow_templates_retrieve
      description: Mixin for API views that operate inside one organization.
      parameters:
      - in: header
        name: X-Organization
        schema:
          type: string
        description: Slug of the active organization.
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateDetail'
          description: ''
    patch:
      operationId: workflow_templates_update
      description: Mixin for API views that operate inside one organization.
      parameters:
      - in: header
        name: X-Organization
        schema:
          type: string
        description: Slug of the active organization.
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTemplateUpdateRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateDetail'
          description: ''
  /api/v1/org/workflow-templates/{id}/draft:
    put:
      operationId: workflow_templates_save_draft
      description: Replace the draft's steps; starts a new draft version when only
        a published one exists.
      parameters:
      - in: header
        name: X-Organization
        schema:
          type: string
        description: Slug of the active organization.
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
          description: ''
  /api/v1/org/workflow-templates/{id}/publish:
    post:
      operationId: workflow_templates_publish
      description: Mixin for API views that operate inside one organization.
      parameters:
      - in: header
        name: X-Organization
        schema:
          type: string
        description: Slug of the active organization.
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
          description: ''
  /api/v1/organizations:
    get:
      operationId: v1_organizations_list
      description: 'Organizations the current user belongs to (not tenant-scoped:
        it is how a tenant is chosen).'
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MyMembership'
          description: ''
    post:
      operationId: v1_organizations_create
      description: 'Organizations the current user belongs to (not tenant-scoped:
        it is how a tenant is chosen).'
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyMembership'
          description: ''
components:
  schemas:
    AcceptInvitationRequest:
      type: object
      properties:
        full_name:
          type: string
          default: ''
          maxLength: 150
        password:
          type: string
          writeOnly: true
          default: ''
          maxLength: 128
    AcceptedInvitation:
      type: object
      description: The new membership plus the signed-in user (the account may have
        just been created).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        organization:
          allOf:
          - $ref: '#/components/schemas/Organization'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
      required:
      - created_at
      - id
      - organization
      - role
      - user
    ApproverTypeEnum:
      enum:
      - user
      - role
      type: string
      description: |-
        * `user` - Specific person
        * `role` - Anyone with a role
    BlankEnum:
      enum:
      - ''
    CategoryEnum:
      enum:
      - purchase
      - expense
      - access
      - other
      type: string
      description: |-
        * `purchase` - Purchase
        * `expense` - Expense
        * `access` - Access
        * `other` - Other
    CreateInvitationRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        role:
          allOf:
          - $ref: '#/components/schemas/InvitableRoleEnum'
          default: member
      required:
      - email
    CsrfResponse:
      type: object
      properties:
        csrfToken:
          type: string
      required:
      - csrfToken
    CurrentOrganization:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 120
          minLength: 2
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        created_at:
          type: string
          format: date-time
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        member_count:
          type: integer
          readOnly: true
      required:
      - created_at
      - id
      - member_count
      - name
      - role
      - slug
    DraftRequest:
      type: object
      properties:
        steps:
          type: array
          items:
            $ref: '#/components/schemas/StepInputRequest'
      required:
      - steps
    InvitableRoleEnum:
      enum:
      - admin
      - member
      type: string
      description: |-
        * `admin` - Admin
        * `member` - Member
    Invitation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        invited_by:
          type: string
          nullable: true
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - expires_at
      - id
      - invited_by
      - role
    InvitationPreview:
      type: object
      properties:
        organization_name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/RoleEnum'
        invited_by:
          type: string
          nullable: true
        expires_at:
          type: string
          format: date-time
        account_exists:
          type: boolean
      required:
      - account_exists
      - email
      - expires_at
      - invited_by
      - organization_name
      - role
    IssuedInvitation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        invited_by:
          type: string
          nullable: true
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        accept_url:
          type: string
          readOnly: true
          description: Shown once. Share it if email delivery fails.
      required:
      - accept_url
      - created_at
      - email
      - expires_at
      - id
      - invited_by
      - role
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - email
      - password
    Member:
      type: object
      description: 'A membership seen from inside the organization: which user and
        with which role.'
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - role
      - user
    MyMembership:
      type: object
      description: 'A membership seen from the current user: which organization and
        with which role.'
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        organization:
          allOf:
          - $ref: '#/components/schemas/Organization'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - organization
      - role
    Organization:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 120
          minLength: 2
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - slug
    OrganizationRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
      required:
      - name
    PaginatedMemberList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cD00ODY%3D"
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cj0xJnA9NDg3
        results:
          type: array
          items:
            $ref: '#/components/schemas/Member'
    PatchedChangeRoleRequest:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/RoleEnum'
    PatchedCurrentOrganizationRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
    PatchedTemplateUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        category:
          $ref: '#/components/schemas/CategoryEnum'
        description:
          type: string
          maxLength: 1000
    RoleEnum:
      enum:
      - owner
      - admin
      - member
      type: string
      description: |-
        * `owner` - Owner
        * `admin` - Admin
        * `member` - Member
    StatusEnum:
      enum:
      - draft
      - published
      - archived
      type: string
      description: |-
        * `draft` - Draft
        * `published` - Published
        * `archived` - Archived
    Step:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        order:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        approver_type:
          allOf:
          - $ref: '#/components/schemas/ApproverTypeEnum'
          readOnly: true
        approver_user:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
          nullable: true
        approver_role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
      required:
      - approver_role
      - approver_type
      - approver_user
      - id
      - name
      - order
    StepInputRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        approver_type:
          $ref: '#/components/schemas/ApproverTypeEnum'
        approver_user:
          type: string
          format: uuid
          nullable: true
        approver_role:
          default: ''
          oneOf:
          - $ref: '#/components/schemas/RoleEnum'
          - $ref: '#/components/schemas/BlankEnum'
      required:
      - approver_type
      - name
    TemplateCreateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        category:
          allOf:
          - $ref: '#/components/schemas/CategoryEnum'
          default: other
        description:
          type: string
          default: ''
          maxLength: 1000
        steps:
          type: array
          items:
            $ref: '#/components/schemas/StepInputRequest'
      required:
      - name
      - steps
    TemplateDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        category:
          allOf:
          - $ref: '#/components/schemas/CategoryEnum'
          readOnly: true
        description:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        published:
          allOf:
          - $ref: '#/components/schemas/Version'
          nullable: true
          readOnly: true
        draft:
          allOf:
          - $ref: '#/components/schemas/Version'
          nullable: true
          readOnly: true
        history:
          type: array
          items:
            $ref: '#/components/schemas/VersionSummary'
          readOnly: true
      required:
      - category
      - created_at
      - description
      - draft
      - history
      - id
      - name
      - published
      - updated_at
    TemplateList:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        category:
          allOf:
          - $ref: '#/components/schemas/CategoryEnum'
          readOnly: true
        description:
          type: string
          readOnly: true
        published_version:
          type: integer
          nullable: true
          readOnly: true
        published_step_count:
          type: integer
          readOnly: true
        has_draft:
          type: boolean
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - category
      - description
      - has_draft
      - id
      - name
      - published_step_count
      - published_version
      - updated_at
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        full_name:
          type: string
          readOnly: true
