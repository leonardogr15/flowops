    TemplateList:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        category:
          allOf:
          - $ref: '#/components/schemas/CategoryEnum'
          readOnly: true
        description:
          type: string
          readOnly: true
        published_version:
          type: integer
          nullable: true
          readOnly: true
        published_step_count:
          type: integer
          readOnly: true
        has_draft:
          type: boolean
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - category
      - description
      - has_draft
      - id
      - name
      - published_step_count
      - published_version
      - updated_at
    TemplateRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
      - id
      - name
    TimelineEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        verb:
          type: string
          readOnly: true
        actor_email:
          type: string
          format: email
          readOnly: true
        data:
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - actor_email
      - created_at
      - data
      - id
      - verb
    UnreadCount:
      type: object
      properties:
        unread:
          type: integer
      required:
      - unread
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        full_name:
          type: string
          readOnly: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
      required:
      - date_joined
      - email
      - full_name
      - id
    Version:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        number:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/VersionStatusEnum'
          readOnly: true
        published_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        published_by:
          type: string
          nullable: true
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        steps:
          type: array
          items:
            $ref: '#/components/schemas/Step'
          readOnly: true
      required:
      - id
      - number
      - published_at
      - published_by
      - status
      - steps
      - updated_at
    VersionStatusEnum:
      enum:
      - draft
      - published
      - archived
      type: string
      description: |-
        * `draft` - Draft
        * `published` - Published
        * `archived` - Archived
    VersionSummary:
      type: object
      properties:
        number:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/VersionStatusEnum'
          readOnly: true
        published_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - number
      - published_at
      - status
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
