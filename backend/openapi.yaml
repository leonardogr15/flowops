  /api/v1/org/requests:
    get:
      operationId: requests_list
      description: Requests visible to the caller. `scope=mine` (default for everyone)
        or `scope=all` (all visible).
      parameters:
      - in: header
        name: X-Organization
        schema:
          type: string
        description: Slug of the active organization.
        required: true
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: scope
        schema:
          type: string
          enum:
          - all
          - mine
        description: mine (default) or all visible
      - in: query
        name: status
        schema:
          type: string
          enum:
          - approved
          - cancelled
          - draft
          - in_review
          - rejected
      tags:
