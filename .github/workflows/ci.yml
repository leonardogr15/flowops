name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: flowops
          POSTGRES_USER: flowops
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U flowops" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      POSTGRES_HOST: localhost
      POSTGRES_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.9"
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint and format
        run: uv run ruff format --check . && uv run ruff check .
      - name: Type check
        run: uv run mypy .
      - name: Migrations are up to date
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Tests (coverage gate in pyproject)
        run: uv run pytest
      - name: OpenAPI schema is committed and current
        run: |
          uv run python manage.py spectacular --file /tmp/openapi.yaml --validate --fail-on-warn
          diff -u openapi.yaml /tmp/openapi.yaml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund --no-audit
      - name: API types match the OpenAPI schema
        run: npm run api:types && git diff --exit-code src/api/schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - name: Dependency audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create CI environment file
        run: python3 scripts/make_env.py
      - name: Build the production API image
        run: docker build --target runtime -t flowops-api:ci backend
      - name: Start the stack
        run: docker compose up -d --build --wait
      - name: Seed demo data
        run: docker compose exec -T api python manage.py seed_demo
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci --no-fund --no-audit
          npx playwright install --with-deps chromium
          DEMO_PASSWORD="$(grep '^DEMO_PASSWORD=' ../.env | cut -d= -f2)" npx playwright test
      - if: failure()
        run: docker compose logs api web --tail 200
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report

  secret-scan:
    # Independent of local hooks: scans the full git history on every push and PR.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git --redact --verbose --exit-code 1 /repo
      - name: gitleaks (working tree)
        run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          dir --redact --exit-code 1 /repo
