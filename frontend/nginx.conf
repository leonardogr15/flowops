# SPA + same-origin reverse proxy to the API (session cookies and CSRF stay first-party).

# Invitation tokens travel in URLs (/invite/<token>, /api/v1/invitations/<token>) and in the
# Referer of requests made from the invitation page; the access log records neither.
map $request_uri $loggable_uri {
    "~^(?<token_prefix>/+(?:api/v1/invitations|invite)/)[^/?]+(?<token_rest>.*)$" "${token_prefix}[redacted]${token_rest}";
    default $request_uri;
}
map $http_referer $loggable_referer {
    "~^(?<ref_prefix>[^?#]*/(?:api/v1/invitations|invite)/)[^/?#]+(?<ref_rest>.*)$" "${ref_prefix}[redacted]${ref_rest}";
    default $http_referer;
}
log_format redacted '$remote_addr - $remote_user [$time_local] "$request_method $loggable_uri $server_protocol" '
                    '$status $body_bytes_sent "$loggable_referer" "$http_user_agent" $request_id';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    access_log /var/log/nginx/access.log redacted;  # replaces the image's default format
    # Error-level lines quote the raw request and Referer (for example when the API is restarting),
    # which would include invitation tokens. Django logs every API request and error already.
    error_log /var/log/nginx/error.log crit;

    # add_header in a location replaces inherited ones, so every location includes the set.
    include /etc/nginx/snippets/security-headers.conf;

    location ~ ^/(api|health)/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
